# Backup semanal do banco (dump lógico → R2). Ver BACKUP.md.
# Requer secrets: DATABASE_URL, STORAGE_S3_ENDPOINT, STORAGE_S3_BUCKET,
# STORAGE_S3_ACCESS_KEY_ID, STORAGE_S3_SECRET_ACCESS_KEY.
name: backup-db

on:
  schedule:
    - cron: "0 6 * * 1" # segundas 06:00 UTC (03:00 BRT)
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 || sudo apt-get install -y -qq postgresql-client
      - name: Dump + upload R2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_S3_ENDPOINT: ${{ secrets.STORAGE_S3_ENDPOINT }}
          STORAGE_S3_REGION: auto
          STORAGE_S3_BUCKET: ${{ secrets.STORAGE_S3_BUCKET }}
          STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.STORAGE_S3_ACCESS_KEY_ID }}
          STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_S3_SECRET_ACCESS_KEY }}
        run: node scripts/backup-db.mjs
